<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"><a href="{% url 'login' %}">Login</a></button>
        <a href="{% url 'logout' %}">Logout</a>
    </form>
    <a href="/">Back to Home</a>
</body>
</html>
